name: Manual synthetic JSON experiment
on:
  workflow_dispatch:
    inputs:
      batch:
        description: Synthetic batch identifier (no market trading dates)
        type: string
        default: manual-batch-3
        required: true
      simulate_failure:
        description: Fail before publication
        type: boolean
        default: false
      simulate_incomplete:
        description: Reject an incomplete synthetic sample
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: synthetic-json-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Generate and validate synthetic sample
        run: node scripts/update-synthetic.cjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          BATCH: ${{ inputs.batch }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
          SIMULATE_INCOMPLETE: ${{ inputs.simulate_incomplete }}
      - name: Publish one atomic Git commit
        shell: bash
        run: |
          git add -- manifest.json test.json snapshots/
          if git diff --cached --quiet; then
            echo "Completed batch already exists; no data commit needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: publish validated synthetic batch'
          git push origin HEAD:main
