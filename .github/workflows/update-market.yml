# Manual integration: Git budget is durable; Mock publishes only in memory.
name: Update market closes (manual; Git budget)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [simulation, real]
        default: real
        description: Real collection requires ENABLED and verified budget; simulation never publishes data
      target_date:
        type: string
        default: ''
        description: Completed US trading date; real mode only
      external_fmp_calls:
        type: string
        default: ''
        description: Cumulative outside-ledger FMP attempts since verified account evidence
      external_fred_calls:
        type: string
        default: ''
        description: Cumulative outside-ledger FRED attempts since verified account evidence
      confirm_external_calls:
        type: boolean
        default: false
        description: Real mode only - confirm these external counts are complete
      verified_account_at:
        type: string
        default: ''
        description: Verified dashboard observation ISO UTC timestamp; never automatically refreshed
      verified_account_used:
        type: string
        default: ''
        description: Verified FMP calls used out of 250
      verified_account_remaining:
        type: string
        default: ''
        description: Verified FMP calls remaining out of 250
      credit_checkpoint_revision:
        type: string
        default: ''
        description: Ledger revision covered by this verified observation; preserve for repeated use
      confirm_account_evidence:
        type: boolean
        default: false
        description: Confirm fresh actual dashboard evidence and that it accounts for prior completed reservations
permissions:
  contents: write
concurrency:
  group: market-data-publication
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'kkshow0105/ynm3000-data-lab-20261016' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MARKET_MODE: ${{ inputs.mode }}
      TARGET_DATE: ${{ inputs.target_date }}
      EXTERNAL_FMP_CALLS: ${{ inputs.external_fmp_calls }}
      EXTERNAL_FRED_CALLS: ${{ inputs.external_fred_calls }}
      CONFIRM_EXTERNAL_CALLS: ${{ inputs.confirm_external_calls }}
      VERIFIED_ACCOUNT_AT: ${{ inputs.verified_account_at }}
      VERIFIED_ACCOUNT_USED: ${{ inputs.verified_account_used }}
      VERIFIED_ACCOUNT_REMAINING: ${{ inputs.verified_account_remaining }}
      CREDIT_CHECKPOINT_REVISION: ${{ inputs.credit_checkpoint_revision }}
      CONFIRM_ACCOUNT_EVIDENCE: ${{ inputs.confirm_account_evidence }}
      ALLOW_REAL_MARKET_PUBLICATION: ${{ vars.ALLOW_REAL_MARKET_PUBLICATION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Mock safety tests (no market requests)
        run: node --test tests/*.test.js
      - name: Mock integrated collection recovery and publication in memory
        if: inputs.mode == 'simulation'
        run: node scripts/market-integration-lab.js
      - name: Persist Git reservation and verify remote readback before collection
        if: inputs.mode == 'real'
        id: prepare
        run: node scripts/market-cloud.js prepare
      - name: Collect validate and publish atomically
        if: inputs.mode == 'real' && steps.prepare.outputs.should_run == 'true'
        run: node scripts/market-cloud.js collect
        env:
          FMP_API_KEY: ${{ inputs.mode == 'real' && secrets.FMP_API_KEY || '' }}
      - name: Remove temporary responses and grants
        if: always()
        run: node -e "const fs=require('node:fs'),p=require('node:path');if(!process.env.RUNNER_TEMP)process.exit(1);fs.rmSync(p.join(process.env.RUNNER_TEMP,'market-update'),{recursive:true,force:true});"
